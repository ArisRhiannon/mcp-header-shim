name: Bug report
description: Something is wrong, missed, or crashed
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: mcp-header-shim version }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: Command, output and OS. Redact secrets and private URLs. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
